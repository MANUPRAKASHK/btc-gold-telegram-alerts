
name: BTC and Gold Hourly Telegram Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '2 * * * *'
concurrency:
  group: btc-gold-market-alerts
  cancel-in-progress: true
jobs:
  market-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests yfinance pandas

      - name: Restore previous alert state
        uses: actions/cache@v4
        with:
          path: alert_state.json
          key: market-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-alert-state-

      - name: Run market alert engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
